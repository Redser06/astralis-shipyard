name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheap gates first, so an obvious failure does not wait on a browser.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The architect endpoint keeps its key server-side by construction. This
      # is the check that turns that claim into a fact.
      - name: Assert no API key reached the client bundle
        run: npm run verify:bundle

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Behavioural and visual tests
        run: npm run test:visual

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
