<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Astralis Shipyard — an interactive 3D starship design studio. Build, kit out and weather your own spacecraft in the browser."
    />
    <title>Astralis Shipyard — Starship Design Studio</title>
    <!--
      Tailwind and the fonts used to be loaded from CDNs here, with the theme
      configured by an inline <script>. Both now compile into the bundle:
      the palette lives in src/index.css under @theme, the fonts ship via
      @fontsource. No third-party requests, no console warning on every load.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif; color: #f8fafc">
        Astralis Shipyard needs JavaScript and WebGL2 to render its 3D viewport.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
